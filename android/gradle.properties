org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-Stabilitaet: die neue Kotlin Build-Tools-API (BTAPI) mit
# inkrementeller Kompilierung schlug mehrfach parallel bei mehreren Modulen
# mit "Could not close incremental caches" fehl (Datei-Sperr-Problem unter
# Windows). Beides deaktiviert, kostet etwas Build-Zeit, ist aber
# zuverlaessig. Bei zukuenftigen Kotlin/Gradle-Updates neu pruefen.
kotlin.incremental=false
org.gradle.parallel=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
